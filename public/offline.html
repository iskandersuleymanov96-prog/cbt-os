<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4a6fa5">
  <title>CBT OS — Офлайн</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #1a1a2e;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 360px;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, #4a6fa5, #6b8fc7);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: white;
      font-weight: 700;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: #666; line-height: 1.5; margin-bottom: 1.5rem; }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid #e0e0e0;
      border-top-color: #4a6fa5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 0.75rem; color: #999; margin-top: 0.75rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🧠</div>
    <h1>CBT OS</h1>
    <p>Вы офлайн. Приложение будет доступно после подключения.</p>
    <div class="spinner" id="spinner"></div>
    <p class="status" id="status">Проверяем подключение...</p>
  </div>
  <script>
    const status = document.getElementById("status");
    const spinner = document.getElementById("spinner");

    function checkConnection() {
      if (navigator.onLine) {
        status.textContent = "Подключение восстановлено!";
        spinner.style.display = "none";
        setTimeout(() => location.reload(), 500);
      } else {
        status.textContent = "Проверяем подключение...";
      }
    }

    window.addEventListener("online", checkConnection);
    window.addEventListener("offline", () => {
      spinner.style.display = "block";
      status.textContent = "Проверяем подключение...";
    });

    setInterval(checkConnection, 3000);
    checkConnection();
  </script>
</body>
</html>
